name: CI
on:
  pull_request:
  push:
    branches: [main, lensstories-big-stack]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
        working-directory: lensstories
      - run: npm run typecheck
        working-directory: lensstories
      - run: npm run lint
        working-directory: lensstories
      - run: npm run build
        working-directory: lensstories
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
